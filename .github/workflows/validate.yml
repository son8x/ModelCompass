# ─────────────────────────────────────────────────────────────
# ModelCompass — CI validate cấu hình
# Chạy trên mỗi push/PR đụng tới thư mục configs/.
# Đảm bảo chỉ cấu hình hợp lệ (cú pháp + cấu trúc) mới được
# đưa vào nhánh chính / production.
# ─────────────────────────────────────────────────────────────
name: validate-configs

on:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.opencode/**'
  pull_request:
    paths:
      - 'configs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.opencode/**'

jobs:
  validate:
    name: Validate opencode configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate production config
        shell: pwsh
        run: |
          & ./scripts/Test-ModelCompassConfig.ps1 -Path configs/production/opencode.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate development config
        shell: pwsh
        run: |
          & ./scripts/Test-ModelCompassConfig.ps1 -Path configs/development/opencode.jsonc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate presets (không strict — env không có trong CI)
        shell: pwsh
        run: |
          Get-ChildItem configs/presets -Filter '*.jsonc' | Where-Object {
            $_.Name -ne 'README.md'
          } | ForEach-Object {
            Write-Host "  → $($_.FullName)"
            & ./scripts/Test-ModelCompassConfig.ps1 -Path $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate templates (per-project + provider template)
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem configs/project-templates -Recurse -Filter '*.json' -File
          $files += Get-ChildItem configs/provider-template -Recurse -Filter '*.json' -File
          foreach ($f in $files) {
            Write-Host "  → $($f.FullName)"
            & ./scripts/Test-ModelCompassConfig.ps1 -Path $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test Suite (Pester) — scripts + validate configs
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0
          }
          & ./scripts/Test-Suite.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: So sánh development vs production (cảnh báo lệch)
        shell: pwsh
        run: |
          & ./scripts/Compare-Config.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Kiểm tra cú pháp plugin TUI (esbuild) + server plugin (node --check)
        shell: bash
        run: |
          set -e
          PLUGINS=".opencode/plugins-xkiro"
          for f in "$PLUGINS"/*.js; do
            echo "  → node --check $f"
            node --check "$f"
          done
          for f in "$PLUGINS"/*.tsx; do
            echo "  → esbuild check $f"
            npx --yes esbuild@0.24.2 "$f" \
              --bundle --external:* --format=esm \
              --jsx=automatic --jsx-import-source=@opentui/solid \
              --outfile="$RUNNER_TEMP/plugin-check.js" >/dev/null
          done
          echo 'OK — plugin syntax/JSX hợp lệ.'

      - name: Check API keys không nằm trong repo
        shell: pwsh
        run: |
          $leaks = Select-String -Path (Get-ChildItem configs -Recurse -File).FullName `
                      -Pattern '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|Bearer\s+[A-Za-z0-9._-]{20,})' `
                      -AllMatches
          if ($leaks) {
            Write-Error "Phát hiện chuỗi giống API key trong config:"
            $leaks | ForEach-Object { Write-Error "  $($_.Path):$($_.LineNumber)" }
            exit 1
          }
          Write-Host 'OK — không thấy API key trong configs/.'

      - name: Chặn file env secret bị theo dõi trong Git
        shell: pwsh
        run: |
          # Cho phép duy nhất .env.sample / .env.example (mẫu không chứa giá trị)
          $bad = git ls-files | Where-Object {
            $_ -match '(?:^|/)\.env(?:\.|$)' -and $_ -notmatch '\.env\.(sample|example)$'
          }
          if ($bad) {
            Write-Error 'Có file env chứa secret đang được theo dõi trong Git:'
            $bad | ForEach-Object { Write-Error "  $_" }
            Write-Error 'Khắc phục: git rm --cached <file> rồi đổi key trên dashboard nhà cung cấp.'
            exit 1
          }
          Write-Host 'OK — không có file .env/.env.local trong index (chỉ chấp nhận mẫu an toàn).'